{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">Recuperar Contraseña</h3>
                <p class="text-muted text-center">Ingresa tu email y te enviaremos un enlace para restablecer tu contraseña.</p>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        {{ form.email }}
                        {% if form.email.errors %}
                            <div class="text-danger small">{{ form.email.errors }}</div>
                        {% endif %}
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Enviar enlace</button>
                    </div>
                </form>

                <div class="text-center mt-3">
                    <a href="{% url 'login' %}">Volver al login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
