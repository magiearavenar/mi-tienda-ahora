{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-4 mb-5">
    <div class="col-md-5 col-lg-4">
        <div style="background:#fff;border-radius:24px;box-shadow:0 8px 32px rgba(255,193,234,0.18);padding:2.5rem 2rem;border:1.5px solid #fce4f5;">

            <!-- Logo -->
            <div class="text-center mb-4">
                <img src="/static/images/logo.png" alt="Mundo Magie" style="max-width:160px;height:auto;" onerror="this.style.display='none'">
                <p style="color:#d2a8dd;font-size:0.82rem;margin-top:0.5rem;letter-spacing:1px;">BIENVENIDA DE VUELTA ✨</p>
            </div>

            {% if form.errors %}
            <div style="background:#fff0f9;border:1px solid #ffc1ea;border-radius:10px;padding:0.75rem 1rem;margin-bottom:1rem;color:#c0567a;font-size:0.85rem;">
                Usuario o contraseña incorrectos.
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold" style="color:#555;font-size:0.85rem;">Usuario</label>
                    <input type="text" name="username" class="form-control" style="border-radius:12px;border:1.5px solid #f3c6ec;padding:0.65rem 1rem;font-size:0.9rem;" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold" style="color:#555;font-size:0.85rem;">Contraseña</label>
                    <input type="password" name="password" class="form-control" style="border-radius:12px;border:1.5px solid #f3c6ec;padding:0.65rem 1rem;font-size:0.9rem;" required>
                </div>
                <button type="submit" class="btn w-100" style="background:var(--color-primario,#ffc1ea);color:#fff;border:none;border-radius:14px;padding:0.75rem;font-weight:600;font-size:0.95rem;letter-spacing:0.5px;box-shadow:0 4px 14px rgba(255,193,234,0.4);transition:all 0.2s;">
                    Ingresar
                </button>
            </form>

            <div class="text-center mt-4" style="font-size:0.85rem;color:#888;">
                <a href="{% url 'password_reset' %}" style="color:#d2a8dd;text-decoration:none;">¿Olvidaste tu contraseña?</a>
                <hr style="border-color:#fce4f5;margin:1rem 0;">
                ¿No tienes cuenta?
                <a href="{% url 'registro' %}" style="color:var(--color-primario,#ffc1ea);font-weight:600;text-decoration:none;"> Regístrate aquí</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
