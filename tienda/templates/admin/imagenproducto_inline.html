{% extends "admin/edit_inline/tabular.html" %}

{% block after_field_sets %}
{{ block.super }}
<div class="bulk-upload-box" style="background:#f8f9fa;border:2px dashed #dee2e6;border-radius:8px;padding:16px 20px;margin:12px 0;">
    <h4 style="font-size:0.95rem;margin-bottom:8px;color:#495057;">📦 Subir varias imágenes a la vez</h4>
    <input type="file" id="imagenes_bulk_input" name="imagenes_bulk" multiple accept="image/*"
           style="display:block;margin-top:8px;" onchange="previewBulkImages(this)">
    <div id="bulk-preview-grid" style="display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;min-height:10px;"></div>
    <small id="bulk-hint-text" style="color:#6c757d;display:block;margin-top:6px;">
        Selecciona varias imágenes con Ctrl+clic (Windows) o Cmd+clic (Mac).
    </small>
</div>
{% endblock %}
