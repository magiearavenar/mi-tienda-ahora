{% extends "admin/change_form.html" %}

{% block extrahead %}
{{ block.super }}
<style>
    input[type="color"] {
        width: 80px !important; height: 50px !important;
        border: 2px solid #ddd !important; border-radius: 8px !important;
        cursor: pointer !important; padding: 0 !important; margin-right: 10px !important;
    }
    input[type="color"]:hover { border-color: #007cba !important; box-shadow: 0 2px 5px rgba(0,0,0,0.1) !important; }

    .bulk-upload-box {
        background: #f8f9fa; border: 2px dashed #dee2e6;
        border-radius: 8px; padding: 16px 20px; margin: 16px 0;
    }
    .bulk-upload-box h4 { font-size: 0.95rem; margin-bottom: 8px; color: #495057; }
    .bulk-upload-box small { color: #6c757d; display: block; margin-top: 6px; }

    .variante-valores-tabla { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.85rem; }
    .variante-valores-tabla th {
        background: #fff0f9; color: #a07ab0; padding: 6px 10px;
        text-align: left; font-weight: 600; border-bottom: 2px solid #ffc1ea;
    }
    .variante-valores-tabla td { padding: 5px 8px; border-bottom: 1px solid #f3d9fa; vertical-align: middle; }
    .variante-valores-tabla input[type="number"] {
        width: 80px; padding: 4px 6px; border: 1px solid #ddd;
        border-radius: 6px; font-size: 0.82rem;
    }
    .variante-valores-tabla input[type="number"]:focus { border-color: #ffc1ea; outline: none; }
    .variante-tabla-wrap {
        background: #fff; border: 1px solid #f3d9fa;
        border-radius: 8px; padding: 10px 14px; margin-top: 6px; display: none;
    }
    .variante-tabla-wrap.visible { display: block; }

    .img-select-wrap { display: flex; align-items: center; gap: 8px; }
    .img-select-preview {
        width: 48px; height: 48px; border-radius: 6px;
        border: 2px solid #f3d9fa; overflow: hidden; flex-shrink: 0;
        background: #fff0f9; display: flex; align-items: center; justify-content: center;
    }
    .img-select-preview img { width: 100%; height: 100%; object-fit: cover; }
    .img-select-dropdown { font-size: 0.78rem; border: 1px solid #ddd; border-radius: 6px; padding: 4px 6px; max-width: 150px; }

    /* Bulk preview drag */
    #bulk-preview-grid > div { cursor: grab !important; user-select: none; }
    #bulk-preview-grid > div:active { cursor: grabbing !important; }
    .bulk-ghost { opacity: 0.4 !important; border: 2px dashed #a07ab0 !important; }
    .bulk-orden-badge {
        position: absolute; bottom: 4px; right: 4px;
        background: rgba(160,122,176,0.9); color: #fff;
        font-size: 0.65rem; font-weight: 700; padding: 1px 5px; border-radius: 6px;
        pointer-events: none;
    }
    .bulk-drag-hint { font-size: 0.75rem; color: #a07ab0; margin-top: 8px; display: block; }
</style>
{% endblock %}

{% block inline_admin_formset %}
{{ block.super }}
{% endblock %}

{% block extrajs %}
{{ block.super }}
<script>
document.addEventListener('DOMContentLoaded', function () {

    // ── PREVIEW BULK ──────────────────────────────────────────
    window.previewBulkImages = function(input) {
        const grid = document.getElementById('bulk-preview-grid');
        grid.innerHTML = '';

        // Destruir sortable anterior si existe
        if (grid._si) { try { grid._si.destroy(); } catch(e){} grid._si = null; }

        const files = Array.from(input.files);
        if (!files.length) return;

        let loaded = 0;
        files.forEach((file, i) => {
            const reader = new FileReader();
            reader.onload = function(e) {
                const wrap = document.createElement('div');
                wrap.dataset.fileIndex = String(i);
                wrap.style.cssText = 'position:relative;width:90px;height:90px;border-radius:8px;overflow:hidden;border:2px solid #ffc1ea;flex-shrink:0;';

                const img = document.createElement('img');
                img.src = e.target.result;
                img.style.cssText = 'width:100%;height:100%;object-fit:cover;pointer-events:none;display:block;';
                wrap.appendChild(img);

                const badge = document.createElement('span');
                badge.className = 'bulk-orden-badge';
                badge.textContent = '#' + (i + 1);
                wrap.appendChild(badge);

                grid.appendChild(wrap);
                loaded++;

                if (loaded === files.length) {
                    // Actualizar hint
                    const hint = document.getElementById('bulk-hint-text');
                    if (hint) hint.textContent = '✦ Arrastra las imágenes para cambiar el orden del slide antes de guardar.';

                    // Iniciar sortable cuando Sortable esté disponible
                    function tryInit() {
                        if (window.Sortable) {
                            grid._si = Sortable.create(grid, {
                                animation: 200,
                                ghostClass: 'bulk-ghost',
                                onEnd: actualizarBadges
                            });
                            actualizarBadges();
                        } else {
                            setTimeout(tryInit, 100);
                        }
                    }
                    tryInit();
                }
            };
            reader.readAsDataURL(file);
        });
    };

    function actualizarBadges() {
        const grid = document.getElementById('bulk-preview-grid');
        if (!grid) return;
        const items = Array.from(grid.children);
        items.forEach((item, i) => {
            const badge = item.querySelector('.bulk-orden-badge');
            if (badge) badge.textContent = '#' + (i + 1);
        });
        // Guardar orden
        let hidden = document.getElementById('bulk-orden-hidden');
        if (!hidden) {
            hidden = document.createElement('input');
            hidden.type = 'hidden'; hidden.id = 'bulk-orden-hidden';
            hidden.name = 'imagenes_bulk_orden';
            grid.parentNode.appendChild(hidden);
        }
        hidden.value = items.map(item => item.dataset.fileIndex || '0').join(',');
    }

    // ── VARIANTES ─────────────────────────────────────────────
    function getProductoId() {
        const m = window.location.pathname.match(/\/producto\/(\d+)\//);
        return m ? m[1] : null;
    }

    let imagenesProducto = [];
    const productoId = getProductoId();

    if (productoId) {
        // Cargar imágenes existentes
        fetch('/obtener-imagenes/' + productoId + '/')
            .then(r => r.json())
            .then(data => {
                imagenesProducto = data.imagenes || [];
                document.querySelectorAll('.variante-tabla-wrap.visible').forEach(wrap => {
                    poblarSelects(wrap, imagenesProducto);
                });
            }).catch(() => {});

        // Cargar datos guardados de variantes desde la BD
        fetch('/variantes-datos/' + productoId + '/')
            .then(r => r.json())
            .then(data => {
                // data = { 'NombreAtributo': { 'valor': { stock, precio, imagen_id, imagen_url } } }
                document.querySelectorAll('input[name$="-valores_texto"]').forEach(inputValores => {
                    const row = inputValores.closest('tr');
                    if (!row) return;
                    const nombreInput = row.querySelector('input[name$="-nombre"]');
                    if (!nombreInput || !nombreInput.value) return;
                    const atributoData = data[nombreInput.value];
                    if (!atributoData) return;
                    inputValores.dataset.guardados = JSON.stringify(atributoData);
                    inputValores.dispatchEvent(new Event('input'));
                });
            }).catch(() => {});
    }

    function poblarSelects(wrap, imagenes) {
        wrap.querySelectorAll('.img-select-dropdown').forEach(select => {
            const valorActual = select.value;
            select.innerHTML = '<option value="">Sin imagen</option>';
            imagenes.forEach(img => {
                const opt = document.createElement('option');
                opt.value = img.id;
                opt.textContent = 'Imagen ' + img.orden + (img.es_principal ? ' ★' : '');
                opt.dataset.url = img.url;
                select.appendChild(opt);
            });
            if (valorActual) select.value = valorActual;
        });
    }

    function initVarianteRow(row) {
        const inputValores = row.querySelector('input[name$="-valores_texto"]');
        if (!inputValores || inputValores.dataset.varianteInit) return;
        inputValores.dataset.varianteInit = '1';
        inputValores.placeholder = 'Ej: S, M, L, XL';

        const wrap = document.createElement('div');
        wrap.className = 'variante-tabla-wrap';
        inputValores.parentNode.appendChild(wrap);

        function renderTabla() {
            const valores = inputValores.value.trim()
                ? inputValores.value.split(',').map(v => v.trim()).filter(Boolean)
                : [];
            wrap.innerHTML = '';
            if (!valores.length) { wrap.classList.remove('visible'); return; }
            wrap.classList.add('visible');

            const tabla = document.createElement('table');
            tabla.className = 'variante-valores-tabla';
            tabla.innerHTML = '<thead><tr><th>Valor</th><th>Stock</th><th>Precio ($)</th><th>Imagen del producto</th></tr></thead><tbody></tbody>';

            const tbody = tabla.querySelector('tbody');
            const guardados = JSON.parse(inputValores.dataset.guardados || '{}');

            valores.forEach(val => {
                const g = guardados[val] || {};
                const previewId = 'prev-' + Math.random().toString(36).slice(2);
                const tr = document.createElement('tr');
                tr.innerHTML =
                    '<td><strong>' + val + '</strong></td>' +
                    '<td><input type="number" min="0" value="' + (g.stock || 0) + '" data-val="' + val + '" data-tipo="stock" onchange="guardarVarianteExtra(this)"></td>' +
                    '<td><input type="number" min="0" value="' + (g.precio || 0) + '" data-val="' + val + '" data-tipo="precio" onchange="guardarVarianteExtra(this)"></td>' +
                    '<td><div class="img-select-wrap">' +
                        '<div class="img-select-preview" id="' + previewId + '">' +
                            (g.imagen_url ? '<img src="' + g.imagen_url + '">' : '<span style="font-size:1.1rem;">🖼️</span>') +
                        '</div>' +
                        '<select class="img-select-dropdown" data-val="' + val + '" data-preview="' + previewId + '" onchange="seleccionarImagenVariante(this)">' +
                            '<option value="">Sin imagen</option>' +
                        '</select>' +
                    '</div></td>';
                tbody.appendChild(tr);
            });

            wrap.appendChild(tabla);
            if (imagenesProducto.length) poblarSelects(wrap, imagenesProducto);

            // Restaurar selección guardada
            wrap.querySelectorAll('.img-select-dropdown').forEach(sel => {
                const g2 = guardados[sel.dataset.val] || {};
                if (g2.imagen_id) sel.value = g2.imagen_id;
            });
        }

        inputValores.addEventListener('input', renderTabla);
        if (inputValores.value) renderTabla();
    }

    window.seleccionarImagenVariante = function(select) {
        const opt = select.options[select.selectedIndex];
        const previewEl = document.getElementById(select.dataset.preview);
        if (opt && opt.dataset.url) {
            previewEl.innerHTML = '<img src="' + opt.dataset.url + '" style="width:100%;height:100%;object-fit:cover;">';
        } else {
            previewEl.innerHTML = '<span style="font-size:1.1rem;">🖼️</span>';
        }
        const row = select.closest('tr.form-row, tr.dynamic-atributos');
        if (!row) return;
        const inputValores = row.querySelector('input[name$="-valores_texto"]');
        if (!inputValores) return;
        const guardados = JSON.parse(inputValores.dataset.guardados || '{}');
        const val = select.dataset.val;
        if (!guardados[val]) guardados[val] = {};
        guardados[val].imagen_id = select.value;
        guardados[val].imagen_url = opt ? (opt.dataset.url || '') : '';
        inputValores.dataset.guardados = JSON.stringify(guardados);
        sincronizarHidden(inputValores, guardados);
    };

    window.guardarVarianteExtra = function(input) {
        const row = input.closest('tr.form-row, tr.dynamic-atributos');
        if (!row) return;
        const inputValores = row.querySelector('input[name$="-valores_texto"]');
        if (!inputValores) return;
        const guardados = JSON.parse(inputValores.dataset.guardados || '{}');
        const val = input.dataset.val;
        if (!guardados[val]) guardados[val] = {};
        guardados[val][input.dataset.tipo] = input.value;
        inputValores.dataset.guardados = JSON.stringify(guardados);
        sincronizarHidden(inputValores, guardados);
    };

    function sincronizarHidden(inputValores, guardados) {
        const hiddenName = inputValores.name.replace('valores_texto', 'valores_extra');
        const tr = inputValores.closest('tr');
        let hidden = tr.querySelector('input[name="' + hiddenName + '"]');
        if (!hidden) {
            hidden = document.createElement('input');
            hidden.type = 'hidden'; hidden.name = hiddenName;
            tr.appendChild(hidden);
        }
        hidden.value = JSON.stringify(guardados);
    }

    document.querySelectorAll('#atributos-group tr.form-row, #atributos-group tr.dynamic-atributos').forEach(initVarianteRow);

    const atributosTbody = document.querySelector('#atributos-group tbody');
    if (atributosTbody) {
        new MutationObserver(() => {
            atributosTbody.querySelectorAll('tr.form-row, tr.dynamic-atributos').forEach(initVarianteRow);
        }).observe(atributosTbody, { childList: true });
    }
});
</script>
{% endblock %}
